; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:weidos_esp32_nbiot_a1]
platform = weidos-esp32
board = weidos_esp32_nbiot_a1
framework = arduino

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ==7.4.3
    https://github.com/michalmonday/CSV-Parser-for-Arduino.git

# 1. Activa los filtros para que la terminal de VS Code entienda los colores ANSI
monitor_filters = colorize, esp32_exception_decoder

# 2. Define el nivel máximo de LOG que quieres permitir (5 = VERBOSE / Todo)
build_flags = 
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_LOG_COLORS=1
    -I src/core
    -I src/drivers
    -I src/storage
    -I src/devices
    -I src/config
    -I src/app